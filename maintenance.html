<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode - Terri API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8 text-center">
        <div class="text-yellow-500 text-6xl mb-4">
            <i class="fas fa-tools"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Under Maintenance</h1>
        <p class="text-gray-600 mb-6">Terri API is currently undergoing maintenance. We'll be back online shortly.</p>
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
            <p class="text-yellow-800 text-sm">
                <i class="fas fa-info-circle mr-2"></i>
                All API endpoints are temporarily unavailable
            </p>
        </div>
        <div class="mt-6 text-sm text-gray-500">
            <p>Thank you for your patience</p>
            <p class="mt-2">- Terri API Team</p>
        </div>
    </div>
</body>
</html>
